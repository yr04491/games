const WALLS = "#LRUD";
const isWall = c => WALLS.indexOf(c) >= 0;
const DIR = { L: [-1, 0], R: [1, 0], U: [0, -1], D: [0, 1] };

// ---------- 画面 ----------
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (game) buildLayer();
}
addEventListener("resize", resize);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - t, 3);

// ---------- 保存 ----------
const SAVE_KEY = "neon-dash-v1";
let save = { best: [0, 0, 0, 0, 0], cleared: 0, coins: 0, sound: true };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function medal(n) { if (n > 0 && window.Medal) Medal.add(n); }

// ---------- 音（短い電子音だけ） ----------
let ac = null;
function audio() {
  if (!save.sound) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function beep(freq, dur, type, vol, slide) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
let dotTick = 0;
const SFX = {
  dash() { beep(220, 0.09, "sawtooth", 0.025, 520); },
  bump() { beep(120, 0.06, "square", 0.03, 90); },
  dot() { dotTick = (dotTick + 1) % 6; beep(880 + dotTick * 40, 0.03, "square", 0.018); },
  coin() { beep(988, 0.06, "square", 0.04); setTimeout(() => beep(1319, 0.1, "square", 0.04), 60); },
  star() { [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => beep(f, 0.09, "triangle", 0.06), i * 55)); },
  die() { beep(300, 0.4, "sawtooth", 0.06, 50); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.14, "triangle", 0.06), i * 90)); },
  shot() { beep(600, 0.05, "square", 0.012, 300); },
};

// ---------- 状態 ----------
let scene = "title";   // title / select / play
let game = null;       // プレイ中のステージ
let T = 32, OX = 0, HUD = 56;
let time = 0, shake = 0;
let buttons = [];
let layer = null;      // 壁などを描いた下絵

function tileSize(cols) { return Math.max(18, Math.min(Math.floor((W - 8) / cols), 42)); }

function startLevel(i) {
  const lv = LEVELS[i];
  const rows = lv.map.length, cols = lv.map[0].length;
  const g = { idx: i, lv, rows, cols, grid: [], dots: new Set(), coins: new Set(), stars: new Set(),
    bats: [], turrets: [], bullets: [], timed: [], spikes: new Set(),
    dotsAll: 0, dotsGot: 0, coinsGot: 0, starsGot: 0,
    p: null, state: "play", stateT: 0, moved: false, waveY: 0, hintT: 3.2,
    trail: [], parts: [], pops: [], camY: 0, exit: null };
  lv.map.forEach((row, y) => {
    g.grid.push(row.split("").map((c, x) => {
      const k = x + "," + y;
      if (c === ".") { g.dots.add(k); g.dotsAll++; }
      if (c === "o") g.coins.add(k);
      if (c === "*") g.stars.add(k);
      if (c === "^") g.spikes.add(k);
      if (c === "t") g.timed.push({ x, y, ph: ((x * 7 + y * 3) % 5) * 0.48 });
      if (c === "b" || c === "v") g.bats.push({ x, y, d: c === "b" ? [1, 0] : [0, 1], sp: 2.6 + (i * 0.25), fl: Math.random() * 6 });
      if (DIR[c]) g.turrets.push({ x, y, d: DIR[c], t: ((x + y) % 3) * 0.6, flash: 0 });
      if (c === "S") g.p = { x, y, sx: x, sy: y, moving: false, d: [0, -1], tx: x, ty: y, queue: null, queueT: 0, squash: 0, look: [0, -1] };
      if (c === "E") g.exit = { x, y };
      return isWall(c) ? "#" : c === "^" ? "^" : " ";
    }));
  });
  g.waveY = g.p.y + 3; g.waveT = 0;
  game = g;
  T = tileSize(cols);
  g.camY = clamp(g.p.y * T - (H - HUD) * 0.6, 0, Math.max(0, rows * T - (H - HUD)));
  buildLayer();
  scene = "play";
}

// ---------- 下絵（壁・トゲ・砲台）は一度だけ描く ----------
function buildLayer() {
  const g = game; if (!g) return;
  T = tileSize(g.cols);
  OX = Math.floor((W - g.cols * T) / 2);
  const cw = g.cols * T, ch = g.rows * T;
  layer = document.createElement("canvas");
  layer.width = Math.round(cw * DPR); layer.height = Math.round(ch * DPR);
  const c = layer.getContext("2d");
  c.scale(DPR, DPR);
  const wall = (x, y) => x < 0 || y < 0 || x >= g.cols || y >= g.rows || g.grid[y][x] === "#";
  // 床：うすい格子
  c.fillStyle = "#02030a"; c.fillRect(0, 0, cw, ch);
  c.fillStyle = "rgba(60,90,200,.12)";
  for (let y = 0; y < g.rows; y++) for (let x = 0; x < g.cols; x++)
    if (!wall(x, y)) c.fillRect(x * T + T / 2 - 1, y * T + T / 2 - 1, 2, 2);
  // 壁の中身：細かいタイル模様
  for (let y = 0; y < g.rows; y++) for (let x = 0; x < g.cols; x++) {
    if (!wall(x, y)) continue;
    const px = x * T, py = y * T;
    c.fillStyle = "#060c2e"; c.fillRect(px, py, T, T);
    c.strokeStyle = "rgba(50,90,255,.35)"; c.lineWidth = 1;
    c.strokeRect(px + 3.5, py + 3.5, T - 7, T - 7);
    c.fillStyle = "rgba(70,120,255,.22)";
    c.fillRect(px + T * 0.3, py + T * 0.3, T * 0.4, 2); c.fillRect(px + T * 0.3, py + T * 0.55, T * 0.25, 2);
  }
  // 壁のふち：床に面した辺だけ、光るネオン
  const edges = () => {
    c.beginPath();
    for (let y = 0; y < g.rows; y++) for (let x = 0; x < g.cols; x++) {
      if (!wall(x, y)) continue;
      const px = x * T, py = y * T, o = 1.5;
      if (!wall(x, y - 1)) { c.moveTo(px, py + o); c.lineTo(px + T, py + o); }
      if (!wall(x, y + 1)) { c.moveTo(px, py + T - o); c.lineTo(px + T, py + T - o); }
      if (!wall(x - 1, y)) { c.moveTo(px + o, py); c.lineTo(px + o, py + T); }
      if (!wall(x + 1, y)) { c.moveTo(px + T - o, py); c.lineTo(px + T - o, py + T); }
    }
  };
  c.lineCap = "square";
  c.save(); c.shadowColor = "#2f6bff"; c.shadowBlur = 14; c.strokeStyle = "#2f6bff"; c.lineWidth = 3; edges(); c.stroke(); c.restore();
  c.strokeStyle = "#9fc0ff"; c.lineWidth = 1; edges(); c.stroke();
  // トゲ
  for (const k of g.spikes) {
    const [x, y] = k.split(",").map(Number);
    drawSpikes(c, x * T, y * T, T, 1, "#ff3b6b");
  }
  // 砲台
  for (const tu of g.turrets) {
    const px = tu.x * T, py = tu.y * T;
    c.fillStyle = "#1a0620"; c.fillRect(px + 2, py + 2, T - 4, T - 4);
    c.save(); c.shadowColor = "#ff3bd4"; c.shadowBlur = 10; c.strokeStyle = "#ff3bd4"; c.lineWidth = 2;
    c.strokeRect(px + 4, py + 4, T - 8, T - 8);
    c.translate(px + T / 2, py + T / 2); c.rotate(Math.atan2(tu.d[1], tu.d[0]));
    c.fillStyle = "#ff3bd4"; c.fillRect(T * 0.05, -T * 0.12, T * 0.45, T * 0.24);
    c.restore();
  }
}

// out: 0〜1（どれだけ出ているか）
function drawSpikes(c, px, py, s, out, col) {
  if (out <= 0) return;
  c.save(); c.shadowColor = col; c.shadowBlur = 8; c.fillStyle = col;
  const n = 3, w = s / n, base = py + s - s * 0.12, h = s * 0.7 * out;
  for (let r = 0; r < 2; r++) {
    const yb = r === 0 ? base : py + s * 0.12 + h;
    c.beginPath();
    for (let i = 0; i < n; i++) {
      const x0 = px + i * w + 2;
      if (r === 0) { c.moveTo(x0, yb); c.lineTo(x0 + (w - 4) / 2, yb - h * 0.55); c.lineTo(x0 + w - 4, yb); }
    }
    c.fill();
  }
  c.beginPath();
  for (let i = 0; i < n; i++) {
    const x0 = px + i * w + 2, yt = py + s * 0.12;
    c.moveTo(x0, yt); c.lineTo(x0 + (w - 4) / 2, yt + h * 0.55); c.lineTo(x0 + w - 4, yt);
  }
  c.fill();
  c.restore();
}

// ---------- 入力 ----------
let touch = null;
cv.addEventListener("pointerdown", e => {
  audio();
  touch = { x: e.clientX, y: e.clientY, used: false, id: e.pointerId };
});
cv.addEventListener("pointermove", e => {
  if (!touch || touch.used || e.pointerId !== touch.id) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
  if (Math.hypot(dx, dy) > 22) {
    touch.used = true;
    swipe(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
  }
});
cv.addEventListener("pointerup", e => {
  if (!touch || e.pointerId !== touch.id) return;
  const t = touch; touch = null;
  if (t.used) return;
  const dx = e.clientX - t.x, dy = e.clientY - t.y;
  if (Math.hypot(dx, dy) > 22) { swipe(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]); return; }
  tap(e.clientX, e.clientY);
});
cv.addEventListener("pointercancel", () => { touch = null; });
addEventListener("keydown", e => {
  audio();
  const k = e.key;
  const m = { ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1] }[k];
  if (m) { e.preventDefault(); swipe(m); return; }
  if (k === "Enter" || k === " ") {
    e.preventDefault();
    if (scene === "title") scene = "select";
    else if (scene === "select") startLevel(Math.min(save.cleared, LEVELS.length - 1));
    else if (game && game.state === "clear" && game.stateT > 0.6) nextLevel();
  }
  if (k === "Escape" && scene === "play") scene = "select";
  if ((k === "r" || k === "R") && scene === "play") startLevel(game.idx);
});
function tap(x, y) {
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  }
  if (scene === "title") { scene = "select"; }
}
function swipe(d) {
  if (scene !== "play" || !game || game.state !== "play") return;
  const p = game.p;
  if (p.moving) { p.queue = d; p.queueT = 0.22; return; }
  dash(d);
}

// ---------- 移動 ----------
const SPEED = 22; // マス/秒
function dash(d) {
  const g = game, p = g.p;
  p.look = d;
  let x = p.x, y = p.y;
  while (g.grid[y + d[1]] && g.grid[y + d[1]][x + d[0]] !== "#") { x += d[0]; y += d[1]; }
  if (x === p.x && y === p.y) { p.squash = 0.6; p.sqd = d; SFX.bump(); return; }
  p.moving = true; p.d = d; p.tx = x; p.ty = y; p.fx = p.x; p.fy = p.y;
  if (!g.moved) { g.moved = true; g.hintT = Math.min(g.hintT, 0.4); }
  SFX.dash();
}

function collect(cx, cy) {
  const g = game, k = cx + "," + cy;
  if (g.dots.delete(k)) { g.dotsGot++; SFX.dot(); }
  if (g.coins.delete(k)) { g.coinsGot++; SFX.coin(); burst(cx, cy, "#ffd23f", 10); g.pops.push({ x: cx, y: cy, text: "+1", t: 0, col: "#ffd23f" }); }
  if (g.stars.delete(k)) { g.starsGot++; SFX.star(); burst(cx, cy, "#fff27a", 18); g.pops.push({ x: cx, y: cy, text: "★", t: 0, col: "#fff27a" }); }
  if (g.spikes.has(k)) die();
  if (g.exit && g.exit.x === cx && g.exit.y === cy) clearLevel();
}

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
    game.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.4 + Math.random() * 0.4, col });
  }
}

function die() {
  const g = game; if (g.state !== "play") return;
  g.state = "dead"; g.stateT = 0; shake = 0.4;
  SFX.die(); burst(g.p.x, g.p.y, "#ffe14d", 26); burst(g.p.x, g.p.y, "#ff3b6b", 14);
}

function clearLevel() {
  const g = game; if (g.state !== "play") return;
  g.state = "clear"; g.stateT = 0; g.p.moving = false;
  SFX.clear(); burst(g.exit.x, g.exit.y, "#43f7ff", 30);
  const i = g.idx;
  save.best[i] = Math.max(save.best[i] || 0, g.starsGot);
  save.cleared = Math.max(save.cleared, i + 1);
  save.coins += g.coinsGot;
  writeSave();
  medal(6 + g.starsGot); // 共通メダル：クリアで6枚＋星1つにつき1枚
}

function nextLevel() {
  if (game.idx + 1 < LEVELS.length) startLevel(game.idx + 1);
  else scene = "select";
}

// ---------- 更新 ----------
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt);
  if (scene !== "play" || !game) return;
  const g = game, p = g.p;
  g.stateT += dt;
  g.hintT -= dt;

  if (g.state === "dead") {
    stepParts(dt);
    if (g.stateT > 1.0) startLevel(g.idx);
    return;
  }

  // 罠は止まっていても動く（クリア後も見た目のために動かす）
  for (const tm of g.timed) tm.out = timedOut(tm);
  for (const b of g.bats) {
    b.fl += dt * 14;
    b.x += b.d[0] * b.sp * dt; b.y += b.d[1] * b.sp * dt;
    const nx = Math.round(b.x + b.d[0] * 0.5), ny = Math.round(b.y + b.d[1] * 0.5);
    const c = g.grid[ny] && g.grid[ny][nx];
    if (c === "#" || c === "^" || c === undefined) {
      b.x = Math.round(b.x); b.y = Math.round(b.y);
      b.d = [-b.d[0], -b.d[1]];
    }
  }
  for (const tu of g.turrets) {
    tu.t += dt; tu.flash = Math.max(0, tu.flash - dt);
    if (tu.t > 2.2) {
      tu.t = 0; tu.flash = 0.15;
      g.bullets.push({ x: tu.x + tu.d[0] * 0.6, y: tu.y + tu.d[1] * 0.6, d: tu.d });
      if (Math.abs(tu.y - p.y) < 8) SFX.shot();
    }
  }
  for (let i = g.bullets.length - 1; i >= 0; i--) {
    const bl = g.bullets[i];
    bl.x += bl.d[0] * 6.5 * dt; bl.y += bl.d[1] * 6.5 * dt;
    const c = g.grid[Math.round(bl.y)] && g.grid[Math.round(bl.y)][Math.round(bl.x)];
    if (c === "#" || c === undefined) { g.bullets.splice(i, 1); }
  }
  // 波：最初の一手から1.2秒たってからせり上がる
  if (g.lv.wave && g.moved && g.state === "play") { g.waveT += dt; if (g.waveT > 1.2) g.waveY -= g.lv.wave * dt; }

  // プレイヤー
  p.squash = Math.max(0, p.squash - dt * 4);
  if (p.queueT > 0) p.queueT -= dt;
  if (g.state === "play" && p.moving) {
    const dist = Math.abs(p.tx - p.x) + Math.abs(p.ty - p.y);
    const step = SPEED * dt;
    g.trail.push({ x: p.x, y: p.y, t: 0 });
    if (step >= dist) {
      p.x = p.tx; p.y = p.ty; p.moving = false; p.squash = 1; p.sqd = p.d;
    } else { p.x += p.d[0] * step; p.y += p.d[1] * step; }
    // 通ったマスを順に調べる（取りこぼしなし）
    const fx = Math.round(p.fx), fy = Math.round(p.fy), cx = Math.round(p.x), cy = Math.round(p.y);
    let ix = fx, iy = fy;
    while (g.state === "play") {
      collect(ix, iy);
      if (ix === cx && iy === cy) break;
      ix += p.d[0]; iy += p.d[1];
    }
    p.fx = cx; p.fy = cy;
    if (!p.moving && g.state === "play" && p.queue && p.queueT > 0) { const q = p.queue; p.queue = null; dash(q); }
  }
  if (g.state === "play") {
    // 当たり判定
    for (const tm of g.timed) if (tm.out > 0.5 && Math.abs(tm.x - p.x) < 0.6 && Math.abs(tm.y - p.y) < 0.6) die();
    for (const b of g.bats) if (Math.hypot(b.x - p.x, b.y - p.y) < 0.62) die();
    for (const bl of g.bullets) if (Math.hypot(bl.x - p.x, bl.y - p.y) < 0.5) die();
    if (g.lv.wave && p.y + 0.3 > g.waveY) die();
  }
  for (const tr of g.trail) tr.t += dt;
  g.trail = g.trail.filter(tr => tr.t < 0.18);
  for (const po of g.pops) po.t += dt;
  g.pops = g.pops.filter(po => po.t < 0.8);
  stepParts(dt);

  // カメラ
  const viewH = H - HUD;
  const maxCam = Math.max(0, g.rows * T - viewH);
  let target = p.y * T - viewH * 0.58;
  if (g.rows * T < viewH) target = -(viewH - g.rows * T) / 2;
  else target = clamp(target, 0, maxCam);
  g.camY = lerp(g.camY, target, 1 - Math.pow(0.0015, dt));
}
function stepParts(dt) {
  const g = game;
  for (const pa of g.parts) { pa.t += dt; pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vx *= 0.92; pa.vy *= 0.92; }
  g.parts = g.parts.filter(pa => pa.t < pa.life);

// 出たり引っ込んだり：2.4秒周期。0.9秒出る、その前0.5秒は予告の点滅
function timedOut(tm) {
  const ph = (time + tm.ph) % 2.4;
  if (ph < 0.9) return ph < 0.1 ? ph / 0.1 : ph > 0.8 ? (0.9 - ph) / 0.1 : 1;
  return 0;
}
function timedWarn(tm) { const ph = (time + tm.ph) % 2.4; return ph > 1.9; }

// ---------- 描画 ----------
function draw() {
  buttons = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#03040c"; ctx.fillRect(0, 0, W, H);
  if (scene === "title") drawTitle();
  else if (scene === "select") drawSelect();
  else drawPlay();
}

function neonText(text, x, y, size, col, glow, weight) {
  ctx.save();
  ctx.font = `${weight || 900} ${size}px ${FONT}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = glow || col; ctx.shadowBlur = size * 0.5;
  ctx.fillStyle = col; ctx.fillText(text, x, y);
  ctx.shadowBlur = 0; ctx.fillText(text, x, y);
  ctx.restore();
}
function button(x, y, w, h, label, fn, opt) {
  opt = opt || {};
  const col = opt.col || "#43f7ff";
  ctx.save();
  ctx.fillStyle = opt.fill || "rgba(10,20,50,.85)";
  ctx.shadowColor = col; ctx.shadowBlur = opt.dim ? 0 : 12;

  ctx.shadowBlur = 0;

  ctx.font = `800 ${opt.size || 17}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);

}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// 背景：流れる格子
function drawGridBg(alpha) {
  ctx.save();
  ctx.strokeStyle = `rgba(47,107,255,${alpha})`; ctx.lineWidth = 1;
  const s = 36, off = (time * 24) % s;
  ctx.beginPath();
  for (let x = (W / 2) % s; x < W; x += s) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = off - s; y < H; y += s) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.restore();
}

function drawTitle() {

function drawSelect() {
  drawGridBg(0.08);
  const cw = Math.min(W - 32, 440), x0 = (W - cw) / 2;

  neonText("STAGE SELECT", W / 2, 84, 26, "#e9f6ff", "#2f6bff");

  ctx.font = `800 15px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";

    ctx.textBaseline = "middle"; ctx.textAlign = "left";

    ctx.fillText(open ? lv.name : "？？？", x0 + 18 + ch * 0.45, y + ch / 2 - (lv.wave && open ? 8 : 0));
    if (open && lv.wave) { ctx.font = `700 11px ${FONT}`; ctx.fillStyle = "#ff6fd8"; ctx.fillText("波あり", x0 + 18 + ch * 0.45, y + ch / 2 + 12); }
    if (open) {

function drawLock(x, y) {
  ctx.save(); ctx.strokeStyle = "#4a5272"; ctx.fillStyle = "#4a5272"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y - 4, 6, Math.PI, 0); ctx.stroke(); ctx.fillRect(x - 9, y - 4, 18, 13); ctx.restore();
}
function drawStar(x, y, r, col) {
  ctx.save(); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = col.startsWith("#") ? 10 : 0;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawCoin(x, y, r) {
  ctx.save();
  ctx.shadowColor = "#ffb800"; ctx.shadowBlur = 8;
  ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#3a2600"; ctx.beginPath(); ctx.arc(x, y, r * 0.68, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd23f"; ctx.beginPath();
  ctx.moveTo(x, y - r * 0.45); ctx.lineTo(x + r * 0.45, y); ctx.lineTo(x, y + r * 0.45); ctx.lineTo(x - r * 0.45, y); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// 主人公：丸い体に黄色いマスク。進む方向へ目が向く
function drawHero(x, y, s, look, squash, sqd) {
  ctx.save();
  ctx.translate(x, y);
  let sx = 1, sy = 1;
  if (squash > 0 && sqd) {
    const k = squash * 0.35;
    if (sqd[0]) { sx = 1 - k; sy = 1 + k * 0.7; } else { sy = 1 - k; sx = 1 + k * 0.7; }
    ctx.translate(sqd[0] * s * k * 0.3, sqd[1] * s * k * 0.3);
  }
  ctx.scale(sx, sy);
  const r = s * 0.42;
  ctx.shadowColor = "#ffcf2e"; ctx.shadowBlur = s * 0.45;
  ctx.fillStyle = "#ffcf2e";
  roundRectC(-r, -r, r * 2, r * 2, r * 0.45); ctx.fill();
  ctx.shadowBlur = 0;
  // マスクの帯
  ctx.fillStyle = "#1a1030";
  roundRectC(-r * 0.86, -r * 0.42, r * 1.72, r * 0.62, r * 0.25); ctx.fill();
  const lx = (look ? look[0] : 0) * r * 0.16, ly = (look ? look[1] : 0) * r * 0.1;
  ctx.fillStyle = "#43f7ff"; ctx.shadowColor = "#43f7ff"; ctx.shadowBlur = s * 0.2;
  ctx.fillRect(-r * 0.52 + lx, -r * 0.24 + ly, r * 0.32, r * 0.26);
  ctx.fillRect(r * 0.2 + lx, -r * 0.24 + ly, r * 0.32, r * 0.26);
  ctx.shadowBlur = 0;
  // 角（マスクの飾り）
  ctx.fillStyle = "#ff8a00";
  ctx.beginPath(); ctx.moveTo(-r * 0.7, -r); ctx.lineTo(-r * 0.45, -r * 1.35); ctx.lineTo(-r * 0.2, -r); ctx.fill();
  ctx.beginPath(); ctx.moveTo(r * 0.7, -r); ctx.lineTo(r * 0.45, -r * 1.35); ctx.lineTo(r * 0.2, -r); ctx.fill();
  // 口
  ctx.fillStyle = "#c46a00"; ctx.fillRect(-r * 0.25, r * 0.42, r * 0.5, r * 0.14);
  ctx.restore();
}
function roundRectC(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawPlay() {
  const g = game, p = g.p;
  const sh = shake > 0 ? (Math.random() - 0.5) * shake * 18 : 0;
  const camY = Math.round(g.camY);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, HUD, W, H - HUD); ctx.clip();
  ctx.translate(OX + sh, HUD - camY + sh * 0.6);
  const sx = c => c * T + T / 2;
  // 見えている範囲
  const r0 = Math.max(0, Math.floor(camY / T) - 1), r1 = Math.min(g.rows - 1, Math.ceil((camY + H - HUD) / T) + 1);
  if (layer) ctx.drawImage(layer, 0, 0, g.cols * T, g.rows * T);

  // 出口
  if (g.exit) {
    const ex = sx(g.exit.x), ey = sx(g.exit.y), pu = 0.5 + 0.5 * Math.sin(time * 5);
    ctx.save(); ctx.shadowColor = "#43f7ff"; ctx.shadowBlur = 18 + pu * 10;
    ctx.strokeStyle = "#43f7ff"; ctx.lineWidth = 3;
    ctx.strokeRect(g.exit.x * T + 4, g.exit.y * T + 4, T - 8, T - 8);
    ctx.fillStyle = `rgba(67,247,255,${0.25 + pu * 0.25})`; ctx.fillRect(g.exit.x * T + 6, g.exit.y * T + 6, T - 12, T - 12);
    ctx.restore();
    ctx.fillStyle = "#e9ffff"; ctx.font = `900 ${Math.round(T * 0.32)}px ${MONO}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("EXIT", ex, ey);
  }
  // ドット・コイン・星
  ctx.fillStyle = "#ffd23f";
  for (const k of g.dots) {
    const [x, y] = k.split(",").map(Number); if (y < r0 || y > r1) continue;
    const d = T * 0.09;
    ctx.fillRect(sx(x) - d, sx(y) - d, d * 2, d * 2);
  }
  for (const k of g.coins) {
    const [x, y] = k.split(",").map(Number); if (y < r0 || y > r1) continue;
    drawCoin(sx(x), sx(y) + Math.sin(time * 4 + x) * 1.5, T * 0.3);
  }
  for (const k of g.stars) {
    const [x, y] = k.split(",").map(Number); if (y < r0 || y > r1) continue;
    ctx.save(); ctx.translate(sx(x), sx(y)); ctx.rotate(Math.sin(time * 3) * 0.2);
    drawStar(0, 0, T * 0.36, "#fff27a"); ctx.restore();
  }
  // 出たり引っ込んだりするトゲ
  for (const tm of g.timed) {
    if (tm.y < r0 || tm.y > r1) continue;
    const px = tm.x * T, py = tm.y * T;
    ctx.strokeStyle = "rgba(255,59,107,.35)"; ctx.lineWidth = 1;
    ctx.strokeRect(px + 3.5, py + 3.5, T - 7, T - 7);
    if (timedWarn(tm) && Math.floor(time * 12) % 2 === 0) { ctx.fillStyle = "rgba(255,59,107,.35)"; ctx.fillRect(px + 4, py + 4, T - 8, T - 8); }
    drawSpikes(ctx, px, py, T, tm.out || 0, "#ff3b6b");
  }
  // 砲台が撃つ瞬間の光
  for (const tu of g.turrets) if (tu.flash > 0) {
    ctx.save(); ctx.globalAlpha = tu.flash / 0.15; ctx.fillStyle = "#ffffff"; ctx.shadowColor = "#ff3bd4"; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(sx(tu.x) + tu.d[0] * T * 0.5, sx(tu.y) + tu.d[1] * T * 0.5, T * 0.2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // 弾
  for (const bl of g.bullets) {
    ctx.save(); ctx.shadowColor = "#ff3bd4"; ctx.shadowBlur = 12; ctx.fillStyle = "#ffb3f0";
    ctx.beginPath(); ctx.arc(sx(bl.x), sx(bl.y), T * 0.16, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // コウモリ
  for (const b of g.bats) drawBat(sx(b.x), sx(b.y), T, b.fl, b.d);
  // 残像
  for (const tr of g.trail) {
    ctx.globalAlpha = (1 - tr.t / 0.18) * 0.35;
    ctx.fillStyle = "#ffcf2e";
    roundRectC(sx(tr.x) - T * 0.36, sx(tr.y) - T * 0.36, T * 0.72, T * 0.72, T * 0.18); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 主人公
  if (g.state !== "dead") {
    const st = p.moving ? 0.25 : 0;
    ctx.save();
    if (p.moving) { ctx.translate(sx(p.x), sx(p.y)); ctx.scale(p.d[0] ? 1 + st : 1 - st * 0.6, p.d[1] ? 1 + st : 1 - st * 0.6); ctx.translate(-sx(p.x), -sx(p.y)); }
    if (g.state === "clear") { const k = clamp(1 - g.stateT * 2, 0, 1); ctx.globalAlpha = k; ctx.translate(sx(p.x), sx(p.y)); ctx.scale(k, k); ctx.translate(-sx(p.x), -sx(p.y)); }
    drawHero(sx(p.x), sx(p.y), T, p.look, p.squash, p.sqd);
    ctx.restore();
  }
  // 波
  if (g.lv.wave) drawWave(g, camY);
  // 粒
  for (const pa of g.parts) {
    ctx.globalAlpha = 1 - pa.t / pa.life; ctx.fillStyle = pa.col;
    const s = T * 0.14; ctx.fillRect(sx(pa.x) - s / 2, sx(pa.y) - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  for (const po of g.pops) {
    ctx.globalAlpha = 1 - po.t / 0.8;
    ctx.fillStyle = po.col; ctx.font = `900 ${Math.round(T * 0.5)}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(po.text, sx(po.x), sx(po.y) - T * 0.4 - po.t * T);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHud(g);
  // ヒント
  if (g.hintT > 0 && g.state === "play") {
    const a = clamp(g.hintT / 0.4, 0, 1);
    ctx.globalAlpha = a;
    const tw = Math.min(W - 32, 380), tx = (W - tw) / 2, ty = H - 96;
    ctx.save(); ctx.fillStyle = "rgba(5,10,30,.88)"; ctx.strokeStyle = "#43f7ff"; ctx.lineWidth = 1.5; ctx.shadowColor = "#43f7ff"; ctx.shadowBlur = 10;
    roundRect(tx, ty, tw, 52, 12); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.fillStyle = "#e9f6ff"; ctx.font = `800 ${W < 360 ? 13 : 15}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(g.lv.hint, W / 2, ty + 26);
    ctx.globalAlpha = 1;
  }
  if (g.state === "dead") {
    const a = clamp((g.stateT - 0.55) / 0.45, 0, 1);
    ctx.fillStyle = `rgba(3,4,12,${a})`; ctx.fillRect(0, 0, W, H);
    neonText("MISS", W / 2, H / 2, 44, "#ff3b6b", "#ff3b6b");
  }
  if (g.state === "clear") drawClear(g);
}

function drawBat(x, y, s, fl, d) {
  ctx.save(); ctx.translate(x, y);
  const w = Math.sin(fl) * 0.5 + 0.5;
  ctx.shadowColor = "#b05bff"; ctx.shadowBlur = s * 0.35; ctx.fillStyle = "#b05bff";
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * s * 0.12, -s * 0.05);
    ctx.lineTo(side * s * 0.46, -s * (0.05 + 0.3 * w));
    ctx.lineTo(side * s * 0.4, s * 0.05);
    ctx.lineTo(side * s * 0.28, s * (0.02 + 0.1 * (1 - w)));
    ctx.lineTo(side * s * 0.12, s * 0.14);
    ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, s * 0.17, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = "#ffffff";
  ctx.fillRect(-s * 0.09, -s * 0.05, s * 0.06, s * 0.06); ctx.fillRect(s * 0.03, -s * 0.05, s * 0.06, s * 0.06);
  ctx.restore();
}

function drawWave(g, camY) {
  const top = g.waveY * T + T / 2;
  const bottom = Math.max(top, camY + H);
  ctx.save();
  const grad = ctx.createLinearGradient(0, top, 0, top + T * 4);
  grad.addColorStop(0, "rgba(255,59,212,.85)"); grad.addColorStop(1, "rgba(80,0,90,.92)");
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.moveTo(-OX, bottom + 40);
  for (let x = -OX; x <= W - OX + 8; x += 8) ctx.lineTo(x, top + Math.sin(x * 0.05 + time * 5) * T * 0.12);
  ctx.lineTo(W - OX + 8, bottom + 40); ctx.closePath(); ctx.fill();
  ctx.shadowColor = "#ff3bd4"; ctx.shadowBlur = 16; ctx.strokeStyle = "#ffc2f2"; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = -OX; x <= W - OX + 8; x += 8) { const yy = top + Math.sin(x * 0.05 + time * 5) * T * 0.12; x === -OX ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
  ctx.stroke();
  ctx.restore();
}

function drawHud(g) {
  ctx.save();
  ctx.fillStyle = "rgba(3,5,16,.96)"; ctx.fillRect(0, 0, W, HUD);
  ctx.strokeStyle = "#2f6bff"; ctx.shadowColor = "#2f6bff"; ctx.shadowBlur = 8; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, HUD - 0.75); ctx.lineTo(W, HUD - 0.75); ctx.stroke();
  ctx.restore();
  // 広い画面では盤面の幅にそろえる
  const L0 = Math.max(8, OX), R0 = Math.min(W - 12, OX + g.cols * T);
  button(L0, 10, 40, 36, "‹", () => { scene = "select"; }, { size: 24, col: "#2f6bff" });
  button(L0 + 46, 10, 40, 36, "↻", () => startLevel(g.idx), { size: 20, col: "#2f6bff" });
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.fillStyle = "#e9f6ff"; ctx.font = `900 15px ${MONO}`;
  ctx.fillText(`STAGE ${g.idx + 1}`, L0 + 96, 22);
  ctx.fillStyle = "#9fc0ff"; ctx.font = `700 11px ${FONT}`;
  ctx.fillText(g.lv.name, L0 + 96, 39);
  // 右側：星・コイン・ドット
  let x = R0;
  ctx.textAlign = "right"; ctx.font = `800 13px ${MONO}`;
  for (let s = 2; s >= 0; s--) { drawStar(x - 8, 20, 8, s < g.starsGot ? "#fff27a" : "rgba(120,130,170,.35)"); x -= 19; }
  x = R0;
  ctx.fillStyle = "#ffd23f"; ctx.fillText(`${g.dotsGot}/${g.dotsAll}`, x, 40);
  const tw = ctx.measureText(`${g.dotsGot}/${g.dotsAll}`).width;
  ctx.fillRect(x - tw - 12, 37, 5, 5);
  ctx.fillText(String(g.coinsGot), x - tw - 26, 40);
  drawCoin(x - tw - 26 - ctx.measureText(String(g.coinsGot)).width - 9, 40, 5.5);
}

function drawClear(g) {
  const t = g.stateT, a = clamp((t - 0.3) / 0.35, 0, 1);
  ctx.fillStyle = `rgba(3,4,12,${a * 0.82})`; ctx.fillRect(0, 0, W, H);
  if (t < 0.3) return;
  const k = ease(a), cy = H * 0.36;
  ctx.save(); ctx.globalAlpha = a;
  neonText(g.idx === LEVELS.length - 1 ? "ALL CLEAR!" : "STAGE CLEAR", W / 2, cy - 70 + (1 - k) * 20, Math.min(W * 0.1, 40), "#43f7ff", "#43f7ff");
  for (let s = 0; s < 3; s++) {
    const on = s < g.starsGot;
    const pop = clamp((t - 0.5 - s * 0.18) / 0.2, 0, 1);
    const r = 24 * (on ? ease(pop) * (1 + 0.25 * Math.sin(pop * Math.PI)) : 1);
    drawStar(W / 2 + (s - 1) * 62, cy, Math.max(r, 0.1), on ? "#fff27a" : "rgba(120,130,170,.35)");
  }
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = `800 16px ${FONT}`;
  ctx.fillStyle = "#ffd23f";
  ctx.fillText(`ドット ${g.dotsGot}/${g.dotsAll}　　コイン +${g.coinsGot}`, W / 2, cy + 52);
  ctx.restore();
  if (t > 0.6) {
    const bw = Math.min(W - 48, 300), bx = (W - bw) / 2;
    const last = g.idx === LEVELS.length - 1;
    button(bx, cy + 90, bw, 50, last ? "ステージ選択へ" : "次のステージ", nextLevel, { size: 18 });
    button(bx, cy + 150, (bw - 10) / 2, 44, "もう一度", () => startLevel(g.idx), { size: 15, col: "#2f6bff" });
    button(bx + (bw + 10) / 2, cy + 150, (bw - 10) / 2, 44, "ステージ選択", () => { scene = "select"; }, { size: 15, col: "#2f6bff" });
  }
}

// ---------- ループ ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);

// 確認用：URL に #stage=3 のように付けると、そのステージから始める
(function () {
  const m = location.hash.match(/stage=(\d+)/);
  if (m) { const i = clamp(parseInt(m[1], 10) - 1, 0, LEVELS.length - 1); startLevel(i); }
})();
</script>
