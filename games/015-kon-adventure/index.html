<script>
"use strict";
// ============================================================
//  コンのぼうけん — キツネの子「コン」の横スクロールアクション
//  ・全8面。草原 → 地下 → 雲の上 → ボスのとりで を2周する
//  ・面の形は番号ごとに決まった種から自動で作る（毎回同じ形）
//  ・敵は上からふんでたおす。箱からハチミツ（大きくなる）・とうがらし（火の玉）
//  ・4面と8面の最後に大イノシシ。3回ふむと勝ち
//  ・画像ファイルなし：すべてコードで描画
// ============================================================
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const FONT = 'system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif';

let W = 0, H = 0, DPR = 1;
const TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || navigator.maxTouchPoints > 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layout();
}
addEventListener("resize", resize);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 定数 ----------
const T = 32, ROWS = 14, STAGES = 8;
const E = 0, G = 1, B = 2, Q = 3, U = 4, HID = 5, PL = 6, C = 7, WL = 8;
const isSolid = t => t === G || t === B || t === Q || t === U || t === WL;
const THEMES = [
  { key: "grass", name: "草原", sky: ["#7fcdfb", "#d9f4ff"], boss: false },
  { key: "cave", name: "地下", sky: ["#1d2233", "#2c3550"], boss: false },
  { key: "sky", name: "雲の上", sky: ["#5fb6f5", "#ffe9f3"], boss: false },
  { key: "fort", name: "ボスのとりで", sky: ["#2a1620", "#5a2a2a"], boss: true },
];
const themeOf = n => THEMES[(n - 1) % 4];

// 動き（単位：ピクセルと秒）
const MAXV = 230, ACC = 1500, AIR_ACC = 1100, DEC = 1800;
const JV = 640, G_HOLD = 1300, G_FALL = 2600, MAXFALL = 820;
const SMALL = { w: 20, h: 28 }, BIG = { w: 24, h: 50 };
const STEP = 1 / 120;

// ============================================================
//  面を作る
// ============================================================
function buildStage(n) {
  const th = themeOf(n), d = n - 1;
  const rng = mulberry(n * 7919 + 101);
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const chance = p => rng() < p;
  const body = th.boss ? 100 + d * 4 : 140 + d * 8;
  const MAXW = body + 140;
  const hg = new Array(MAXW).fill(2);   // 地面の高さ（0は穴）
  const feats = [], contents = new Map(), spawns = [], cands = [];
  let x = 0, blocksN = 0, powerLeft = 2 + (d >= 4 ? 1 : 0), oneup = false, cp = null, last = "";
  const top = c => ROWS - hg[c];
  const put = (cx, cy, t, c) => { feats.push([cx, cy, t]); if (c) contents.set(cx + "," + cy, c); };
  const POOL = {
    grass: d < 2 ? ["rock", "rock", "bird"] : ["rock", "rock", "bird", "spike"],
    cave: d < 2 ? ["rock", "rock", "bee"] : ["rock", "bee", "spike"],
    sky: ["bird", "bee", "rock"],
    fort: d < 4 ? ["rock", "rock", "spike"] : ["rock", "spike", "spike", "bee"],
  }[th.key];
  const enemy = (cx, type) => {
    type = type || POOL[Math.floor(rng() * POOL.length)];
    if (type === "bird" || type === "bee") spawns.push({ type, cx, row: top(cx) - ri(3, 4) });
    else spawns.push({ type, cx, row: null });
  };

  // ---- 部品 ----
  const parts = {
    flat() {
      const w = ri(6, 10);
      const ne = chance(0.45 + d * 0.06) ? (chance(0.2 + d * 0.06) ? 2 : 1) : 0;
      for (let i = 0; i < ne; i++) enemy(x + ri(3, w - 2));
      if (chance(0.35)) for (let i = 2; i < 6; i++) put(x + i, ROWS - 2 - 3, C);
      x += w;
    },
    pit() {
      const a = 3, gap = ri(2, Math.min(4, 2 + Math.floor(d / 3) + (chance(0.3) ? 1 : 0))), b = 3;
      for (let i = 0; i < gap; i++) hg[x + a + i] = 0;
      const g0 = x + a, r = ROWS - 2;
      if (chance(0.6)) for (let i = -1; i <= gap; i++) put(g0 + i, r - 3 - (i >= 0 && i < gap ? 1 : 0), C);
      cands.push({ cx: g0 + Math.floor(gap / 2), row: r - 5 });
      if (chance(0.3 + d * 0.05)) enemy(x + a + gap + 2);
      x += a + gap + b;
    },
    blocks() {
      const w = 12, r = ROWS - 2 - 4;
      for (let i = 0; i < 5; i++) {
        const isQ = i % 2 === 1;
        let c = null;
        if (isQ) { if (i === 1 && powerLeft > 0) { c = "power"; powerLeft--; } else c = "coin"; }
        put(x + 3 + i, r, isQ ? Q : B, c);
      }
      if (chance(0.4)) { put(x + 5, r - 4, Q, "coin"); cands.push({ cx: x + 3, row: r - 3 }); }
      else cands.push({ cx: x + 5, row: r - 3 });
      if (!oneup && blocksN === 1) { put(x + 10, r, HID, "oneup"); oneup = true; }
      else if (chance(0.3)) put(x + 10, r, HID, "coin");
      if (chance(0.5 + d * 0.05)) enemy(x + ri(4, 9));
      blocksN++; x += w;
    },
    stairs() {
      const k = ri(3, 4);
      for (let i = 0; i < k; i++) hg[x + i] = 3 + i;
      hg[x + k] = hg[x + k + 1] = 2 + k;
      cands.push({ cx: x + k, row: ROWS - (2 + k) - 4 });
      let p = x + k + 2;
      if (d >= 2 && chance(0.5)) {
        const gap = ri(2, 3);
        for (let i = 0; i < gap; i++) hg[p + i] = 0;
        p += gap + 3;
      } else {
        for (let i = k - 1; i >= 0; i--) hg[p++] = 3 + i;
        p += 2;
      }
      if (chance(0.4 + d * 0.05)) enemy(p - 1);
      x = p;
    },
    pillars() {
      const cnt = ri(2, 3);
      let p = x + 3;
      for (let k = 0; k < cnt; k++) {
        const h = ri(4, Math.min(6, 4 + Math.floor(d / 2)));
        hg[p] = hg[p + 1] = h;
        p += 2;
        if (k < cnt - 1) {
          if (d >= 3 && chance(0.4)) { hg[p] = hg[p + 1] = 0; p += 2; }
          else { if (chance(0.5 + d * 0.05)) enemy(p + 1); p += ri(3, 4); }
        }
      }
      x = p + 3;
    },
    float() {
      let p = x + 2;
      const plats = ri(2, 3);
      for (let k = 0; k < plats; k++) {
        const gap = ri(2, 3), pr = ri(8, 9);
        for (let i = 0; i < gap; i++) hg[p + i] = 0;
        p += gap;
        for (let i = 0; i < 3; i++) { hg[p + i] = 0; put(p + i, pr, PL); }
        if (chance(0.5)) put(p + 1, pr - 1, C);
        if (k === 1) cands.push({ cx: p + 1, row: pr - 4 });
        p += 3;
      }
      const gap = 2;
      for (let i = 0; i < gap; i++) hg[p + i] = 0;
      p += gap;
      if (chance(0.35 + d * 0.06)) spawns.push({ type: chance(0.5) ? "bird" : "bee", cx: p - 4, row: 6 });
      x = p + 3;
    },
    ceiling() {
      const w = 10, r = ROWS - 2 - 5;
      for (let i = 1; i < w - 1; i++) put(x + i, r, i === 5 ? Q : B, i === 5 ? "coin" : null);
      for (let i = 3; i < 7; i++) put(x + i, ROWS - 2 - 2, C);
      if (chance(0.5 + d * 0.05)) enemy(x + 7);
      x += w;
    },
    birds() {
      const w = 12;
      enemy(x + 6, chance(0.5) ? "bird" : (th.key === "cave" ? "bee" : "bird"));
      if (chance(0.3 + d * 0.06)) enemy(x + 10);
      x += w;
    },
  };
  const WEIGHTS = {
    grass: { flat: 3, pit: 3, blocks: 2, stairs: 2, pillars: 2, birds: 1, float: 1 },
    cave: { flat: 2, pit: 2, blocks: 2, ceiling: 2, pillars: 2, stairs: 1 },
    sky: { float: 4, pit: 3, blocks: 2, birds: 2, flat: 1 },
    fort: { flat: 2, pit: 3, pillars: 2, stairs: 2, blocks: 1 },
  }[th.key];
  const pickPart = () => {
    const ks = Object.keys(WEIGHTS).filter(k => k !== last);
    let sum = 0; for (const k of ks) sum += WEIGHTS[k];
    let r = rng() * sum;
    for (const k of ks) { r -= WEIGHTS[k]; if (r < 0) return k; }
    return ks[0];
  };

  // ---- 並べる ----
  x = 12;
  parts.blocks(); last = "blocks";
  while (x < body) {
    if (!th.boss && !cp && x >= body / 2) { cp = { cx: x + 2 }; x += 5; continue; }
    const k = (blocksN < 2 && x > body * 0.4 && last !== "blocks") ? "blocks" : pickPart();   // 箱の並びは必ず2か所以上
    parts[k](); last = k;
  }
  let den, arena = null, w;
  if (!th.boss) { den = { cx: x + 9 }; w = x + 16; }
  else {
    cp = { cx: x + 2 }; x += 6;
    const a0 = x, a1 = a0 + 23;
    arena = { a0, a1 };
    den = { cx: a1 + 6 };
    w = a1 + 13;
  }
  for (let c = 0; c < w; c++) if (c >= MAXW) hg[c] = 2;

  // ---- タイルにする ----
  const tiles = new Uint8Array(w * ROWS);
  const set = (cx, cy, t) => { if (cx >= 0 && cx < w && cy >= 0 && cy < ROWS) tiles[cy * w + cx] = t; };
  for (let c = 0; c < w; c++) for (let y = ROWS - hg[c]; y < ROWS; y++) set(c, y, G);
  if (th.key === "cave" || th.key === "fort") for (let c = 0; c < w; c++) { set(c, 0, th.key === "fort" ? WL : G); set(c, 1, th.key === "fort" ? WL : G); }
  for (const [cx, cy, t] of feats) set(cx, cy, t);
  if (arena) for (let y = 0; y < ROWS - 2; y++) set(arena.a1, y, WL);

  // ---- 大きな金貨（前・中・後ろから1枚ずつ）----
  const bigs = [];
  for (let i = 0; i < 3; i++) {
    const lo = 12 + (body - 12) * i / 3, hi = 12 + (body - 12) * (i + 1) / 3;
    const cs = cands.filter(c => c.cx >= lo && c.cx < hi);
    if (cs.length) { const c = cs[Math.floor(rng() * cs.length)]; bigs.push({ cx: c.cx, row: c.row }); }
    else {
      let c = Math.floor((lo + hi) / 2);
      while (c < hi && hg[c] === 0) c++;
      bigs.push({ cx: c, row: ROWS - hg[c] - 5 });
    }
  }
  return { n, th, d, w, tiles, contents, spawns, bigs, cp, den, arena, ceil: th.key === "cave" || th.key === "fort" };
}

// ============================================================
//  タイルと当たり判定
// ============================================================
function tileAt(L, cx, cy) {
  if (cx < 0 || cx >= L.w) return WL;
  if (cy < 0) return L.ceil ? WL : E;
  if (cy >= ROWS) return E;
  return L.tiles[cy * L.w + cx];
}
function setTile(L, cx, cy, t) { if (cx >= 0 && cx < L.w && cy >= 0 && cy < ROWS) L.tiles[cy * L.w + cx] = t; }
const solidAt = (L, cx, cy) => isSolid(tileAt(L, cx, cy));
// その列の地面の一番上（天井やブロックは無視して、下から数える）
function groundTop(L, cx) { let r = ROWS - 1; if (!solidAt(L, cx, r)) return ROWS; while (r > 0 && solidAt(L, cx, r - 1)) r--; return r; }

// 体を動かす（x→yの順）。onHead：頭をぶつけたタイルを知らせる（プレイヤーのみ）
function moveBody(b, dt, L, onHead) {
  b.hitWall = 0;
  b.x += b.vx * dt;
  let t0 = Math.floor(b.y / T), t1 = Math.floor((b.y + b.h - 0.01) / T);
  if (b.vx > 0) {
    const cx = Math.floor((b.x + b.w - 0.01) / T);
    for (let cy = t0; cy <= t1; cy++) if (solidAt(L, cx, cy)) { b.x = cx * T - b.w; b.vx = 0; b.hitWall = 1; break; }
  } else if (b.vx < 0) {
    const cx = Math.floor(b.x / T);
    for (let cy = t0; cy <= t1; cy++) if (solidAt(L, cx, cy)) { b.x = (cx + 1) * T; b.vx = 0; b.hitWall = -1; break; }
  }
  const prevBottom = b.y + b.h, prevTop = b.y;
  b.y += b.vy * dt;
  b.onGround = false;
  const l = Math.floor(b.x / T), r = Math.floor((b.x + b.w - 0.01) / T);
  if (b.vy >= 0) {
    const cy = Math.floor((b.y + b.h) / T);
    for (let cx = l; cx <= r; cx++) {
      const t = tileAt(L, cx, cy);
      if (isSolid(t) || (t === PL && prevBottom <= cy * T + 0.5)) { b.y = cy * T - b.h; b.vy = 0; b.onGround = true; break; }
    }
  } else {
    const cy = Math.floor(b.y / T);
    const hits = [];
    for (let cx = l; cx <= r; cx++) {
      const t = tileAt(L, cx, cy);
      if (isSolid(t) || (onHead && t === HID && prevTop >= (cy + 1) * T - 0.5)) hits.push(cx);
    }
    if (hits.length) {
      // 角にちょっとだけ当たったときは、横にずらしてすり抜ける
      if (onHead && hits.length === 1) {
        const cx = hits[0];
        const overL = (b.x + b.w) - cx * T, overR = (cx + 1) * T - b.x;
        if (cx === l && overR < 9 && !solidAt(L, cx + 1, cy)) { b.x = (cx + 1) * T; return; }
        if (cx === r && overL < 9 && !solidAt(L, cx - 1, cy)) { b.x = cx * T - b.w; return; }
      }
      b.y = (cy + 1) * T; b.vy = 0;
      if (onHead) {
        const mid = b.x + b.w / 2;
        let best = hits[0];
        for (const cx of hits) if (Math.abs((cx + 0.5) * T - mid) < Math.abs((best + 0.5) * T - mid)) best = cx;
        onHead(best, cy);
      }
    }
  }
}

// プレイヤーの1ステップ（入力 inp = {left,right,jumpHeld,jumpBuf,coyote}）
function playerPhys(p, inp, dt, L, onHead) {
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  if (dir) {
    const a = p.onGround ? ACC : AIR_ACC;
    if (p.vx * dir < 0 && p.onGround) p.vx += dir * DEC * dt;
    else p.vx += dir * a * dt;
    p.vx = clamp(p.vx, -MAXV, MAXV);
    p.face = dir;
  } else if (p.onGround) {
    const s = Math.sign(p.vx), m = Math.max(0, Math.abs(p.vx) - DEC * dt);
    p.vx = s * m;
  }
  if (p.onGround) p.coyote = 0.08; else p.coyote -= dt;
  if (p.jumpBuf > 0) p.jumpBuf -= dt;
  let jumped = false;
  if (p.jumpBuf > 0 && p.coyote > 0) { p.vy = -JV; p.jumpBuf = 0; p.coyote = 0; p.onGround = false; jumped = true; }
  p.vy += (p.vy < 0 && inp.jumpHeld ? G_HOLD : G_FALL) * dt;
  if (p.vy > MAXFALL) p.vy = MAXFALL;
  p.prevBottom = p.y + p.h;
  moveBody(p, dt, L, onHead);
  return jumped;
}

// ============================================================
//  音
// ============================================================
let AC = null, master = null, mute = false, bgmT = 0, bgmStep = 0;
try { mute = localStorage.getItem("kusoge015-mute") === "1"; } catch (e) { }
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") AC.resume();
}
function note(freq, dur, vol, type = "square", slide = 0, delay = 0) {
  if (!AC || mute) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const sndJump = () => note(330, 0.18, 0.05, "square", 2.2);
const sndCoin = () => { note(988, 0.07, 0.04); note(1319, 0.25, 0.04, "square", 1, 0.07); };
const sndStomp = () => note(260, 0.14, 0.07, "triangle", 0.4);
const sndBump = () => note(140, 0.1, 0.07, "triangle", 0.7);
const sndBreak = () => { note(200, 0.2, 0.06, "sawtooth", 0.3); note(120, 0.2, 0.05, "square", 0.4); };
const sndItem = () => [392, 523, 659, 784].forEach((f, i) => note(f, 0.1, 0.035, "square", 1, i * 0.05));
const sndPower = () => [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, 0.12, 0.04, "square", 1, i * 0.06));
const sndFire = () => note(700, 0.12, 0.04, "sawtooth", 0.35);
const sndHurt = () => note(500, 0.4, 0.06, "square", 0.3);
const sndDie = () => [523, 494, 466, 440, 392, 330, 262].forEach((f, i) => note(f, 0.14, 0.05, "square", 1, i * 0.11));
const sndOneUp = () => [659, 784, 1319, 1047, 1175, 1568].forEach((f, i) => note(f, 0.1, 0.04, "square", 1, i * 0.07));
const sndClear = () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, 0.22, 0.05, "square", 1, i * 0.12));
const sndBossHit = () => { note(180, 0.3, 0.08, "sawtooth", 0.5); note(90, 0.3, 0.07, "square", 0.5); };
const sndThud = () => note(80, 0.3, 0.09, "triangle", 0.5);
const sndLantern = () => [784, 988, 1175].forEach((f, i) => note(f, 0.2, 0.04, "triangle", 1, i * 0.08));
// BGM：面の種類ごとの短いくり返し
const BGM = {
  grass: { tempo: 0.15, mel: [72, 0, 76, 79, 0, 76, 74, 72, 74, 0, 76, 0, 72, 0, 67, 0], bass: [48, 55, 52, 55] },
  cave: { tempo: 0.19, mel: [60, 0, 63, 0, 67, 0, 63, 0, 58, 0, 62, 0, 65, 0, 62, 0], bass: [36, 36, 34, 34] },
  sky: { tempo: 0.16, mel: [79, 0, 84, 0, 83, 79, 76, 0, 77, 0, 81, 0, 79, 76, 72, 0], bass: [53, 60, 55, 60] },
  fort: { tempo: 0.14, mel: [62, 0, 62, 65, 0, 62, 68, 0, 62, 0, 62, 65, 0, 67, 66, 0], bass: [38, 38, 44, 37] },
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function bgmTick(dt) {
  if (!AC || mute || scene !== "play" || !L) return;
  const b = BGM[L.th.key];
  bgmT -= dt;
  if (bgmT <= 0) {
    bgmT += b.tempo;
    const m = b.mel[bgmStep % b.mel.length];
    if (m) note(mtof(m), b.tempo * 1.6, 0.014, "square");
    if (bgmStep % 4 === 0) note(mtof(b.bass[(bgmStep / 4 | 0) % b.bass.length]), b.tempo * 3.5, 0.03, "triangle");
    bgmStep++;
    if (bgmT < -0.5) bgmT = 0;
  }
}

// ============================================================
//  状態
// ============================================================
const SAVE = "kusoge015-save";
let SV = { v: 1, best: 1, big: Array.from({ length: STAGES }, () => [0, 0, 0]), allClear: false };
try { const s = JSON.parse(localStorage.getItem(SAVE) || "null"); if (s && s.v === 1) SV = Object.assign(SV, s); } catch (e) { }
function save() { try { localStorage.setItem(SAVE, JSON.stringify(SV)); } catch (e) { } }
function medal(n) { if (n > 0 && window.Medal) Medal.add(n); }

let scene = "title";      // title / play / clear / over / ending
let paused = false;
let L = null, P = null, ents = [], items = [], fires = [], parts = [], pops = [], bigs = [];
let boss = null, arenaOn = false, gateOpenT = -1, gateOpened = false;
let run = { stage: 1, lives: 5, coins: 0, form: 0, cpHit: false, bigGot: [false, false, false], stageMedals: 0 };
let camX = 0, shake = 0, bannerT = 0, clearT = 0, deathT = 0, msg = null, bumps = new Map();
let fireCool = 0;
const input = { left: false, right: false, jumpHeld: false, fire: false };
function say(text, t = 1.4) { msg = { text, t }; }

function newRun(stage) {
  run = { stage, lives: 5, coins: 0, form: 0, cpHit: false, bigGot: [false, false, false], stageMedals: 0 };
  loadStage(stage, false);
  scene = "play"; paused = false;
}
function loadStage(n, fromCp) {
  L = buildStage(n);
  ents = L.spawns.map(s => {

function drawBigCoin(x, y, r, time, got, still) {
  const s = got || still ? 1 : Math.abs(Math.cos(time * 2.5));
  ctx.save(); ctx.translate(x, y); ctx.scale(Math.max(0.15, s), 1);
  ctx.fillStyle = got ? "rgba(255,255,255,0.25)" : "#ffcf33"; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = got ? "rgba(255,255,255,0.5)" : "#c98a12"; ctx.lineWidth = r * 0.14; ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = got ? "rgba(255,255,255,0.5)" : "#fff3b0";
  ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.25 : r * 0.55; ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawDen(cx, time) {
  const x = cx * T, gy = (ROWS - 2) * T;
  const col = L.th.key === "sky" ? "#f1f6ff" : L.th.key === "cave" ? "#5d6a8c" : L.th.key === "fort" ? "#6a5a50" : "#8fc46a";
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x + T * 1.5, gy, T * 2.6, T * 1.9, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#2a1c14"; ctx.beginPath(); ctx.ellipse(x + T * 1.5, gy, T * 0.95, T * 1.2, 0, Math.PI, 0); ctx.fill();
  // 看板
  ctx.fillStyle = "#8a5a32"; ctx.fillRect(x + T * 3.6, gy - 46, 4, 46);
  ctx.fillStyle = "#c9925a"; rr(x + T * 3.6 - 22, gy - 62, 48, 22, 4); ctx.fill();
  txt("ゴール", x + T * 3.6 + 2, gy - 51, 11, "#4a2a12");
}
function drawLantern(cx, lit, time) {
  const x = cx * T + 16;
  const gy = groundTop(L, cx) * T;
  ctx.fillStyle = "#5a3a22"; ctx.fillRect(x - 2, gy - 70, 4, 70); ctx.fillRect(x - 2, gy - 70, 16, 3);
  if (lit) { const g = ctx.createRadialGradient(x + 12, gy - 52, 2, x + 12, gy - 52, 40); g.addColorStop(0, "rgba(255,190,80,0.6)"); g.addColorStop(1, "rgba(255,190,80,0)"); ctx.fillStyle = g; ctx.fillRect(x - 30, gy - 95, 84, 84); }
  ctx.fillStyle = lit ? "#ff6b3a" : "#b9a89a"; rr(x + 4, gy - 64, 16, 22, 7); ctx.fill();
  ctx.fillStyle = "#3a2a20"; ctx.fillRect(x + 6, gy - 66, 12, 3); ctx.fillRect(x + 6, gy - 43, 12, 3);
  if (lit) { ctx.fillStyle = "rgba(255,240,180,0.9)"; ctx.fillRect(x + 10, gy - 58, 4, 10); }
}

function drawWorld(time) {
  const th = L.th;
  const sx = shake > 0 ? (Math.random() - 0.5) * 8 : 0, sy = shake > 0 ? (Math.random() - 0.5) * 6 : 0;
  drawBackground(th, camX, time);
  ctx.save();
  ctx.translate(sx, offY + sy); ctx.scale(scale, scale); ctx.translate(-camX, 0);
  const c0 = Math.max(0, Math.floor(camX / T) - 1), c1 = Math.min(L.w - 1, Math.ceil((camX + viewW) / T) + 1);
  // 溶岩（とりでの穴）
  if (th.key === "fort") {
    for (let cx = c0; cx <= c1; cx++) if (tileAt(L, cx, ROWS - 1) === E) {
      ctx.fillStyle = "#ff5a1f"; ctx.fillRect(cx * T, (ROWS - 1) * T + 10 + Math.sin(time * 3 + cx) * 3, T, T);
      ctx.fillStyle = "#ffb03a"; ctx.fillRect(cx * T, (ROWS - 1) * T + 10 + Math.sin(time * 3 + cx) * 3, T, 4);
    }
  }
  if (L.den.cx + 5 >= c0 && L.den.cx - 3 <= c1) drawDen(L.den.cx, time);
  if (L.cp && L.cp.cx >= c0 - 2 && L.cp.cx <= c1 + 2) drawLantern(L.cp.cx, run.cpHit, time);
  for (const it of items) if (it.rise !== undefined && it.rise < 1) drawItem(it, time);   // 箱から出てくる途中は箱の後ろ
  for (let cx = c0; cx <= c1; cx++) for (let cy = 0; cy < ROWS; cy++) {
    const t = L.tiles[cy * L.w + cx];
    if (t !== E && t !== HID) drawTile(t, cx, cy, th, time);
  }
  for (const b of bigs) if (!b.got) drawBigCoin(b.x + 14, b.y + 14, 14, time, false);
  for (const it of items) if (it.rise === undefined || it.rise >= 1) drawItem(it, time);
  for (const e of ents) if (e.active) drawEnemy(e, time);
  if (boss && !boss.gone) drawBoss(boss, time);
  for (const f of fires) {
    ctx.fillStyle = "#ff7a1f"; ctx.beginPath(); ctx.arc(f.x + 6, f.y + 6, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffe27a"; ctx.beginPath(); ctx.arc(f.x + 6, f.y + 6, 3, 0, Math.PI * 2); ctx.fill();
  }
  // コン
  if (P) {
    const blink = P.inv > 0 && !P.dead && Math.floor(P.inv * 14) % 2 === 0;
    const alpha = scene === "clear" ? clamp(1 - (clearT - 1.0) / 0.5, 0, 1) : 1;
    if (!blink) drawKon(P.x + P.w / 2, P.y + P.h + 1, P.h + (P.h > 30 ? 0 : 0), P.face, P.dead ? 0 : run.form, P.anim, Math.abs(P.vx) > 20 && P.onGround, !P.onGround, alpha);
  }
  for (const p of parts) {
    if (p.kind === "brick") { ctx.fillStyle = TC[th.key].brick; ctx.fillRect(p.x - 6, p.y - 6, 12, 12); }
    else { ctx.fillStyle = `rgba(255,220,160,${p.t / 0.35})`; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill(); }
  }
  for (const p of pops) { ctx.globalAlpha = clamp(p.t / 0.5, 0, 1); txtO(p.text, p.x, p.y - 10, 14, p.color); ctx.globalAlpha = 1; }
  ctx.restore();
}

function drawHUD(time) {
  const small = W < 520;
  const fs = small ? 14 : 17;
  const y = 22;
  rr(8, 6, small ? W - 64 : 470, 34, 10); ctx.fillStyle = "rgba(0,0,0,0.32)"; ctx.fill();
  let x = 18;
  txt(`第${run.stage}面`, x, y + 1, fs, "#fff", "left", 900); x += small ? 50 : 62;
  drawKon(x + 8, y + 11, 18, 1, 0, 0, false, false); txt(`×${run.lives}`, x + 18, y + 1, fs, "#fff", "left", 900); x += small ? 50 : 62;
  ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.ellipse(x + 6, y, 6, 8, 0, 0, Math.PI * 2); ctx.fill();
  txt(`×${run.coins}`, x + 15, y + 1, fs, "#fff", "left", 900); x += small ? 56 : 70;
  for (let i = 0; i < 3; i++) {
    drawBigCoin(x + 10 + i * 22, y, 9, time, false, true);
    if (!run.bigGot[i]) { ctx.fillStyle = "rgba(40,40,60,0.75)"; ctx.beginPath(); ctx.arc(x + 10 + i * 22, y, 9.5, 0, Math.PI * 2); ctx.fill(); }
  }
  if (!small) txt(L.th.name, x + 80, y + 1, 14, "rgba(255,255,255,0.85)", "left", 800);
  // メニュー
  button(W - 50, 6, 42, 34, "≡", { fill: "rgba(0,0,0,0.32)", color: "#fff", size: 18, r: 10 }, () => { paused = true; });
  // ボスの体力
  if (boss && arenaOn && !boss.dead) {
    const bx = W / 2 - 80, byy = 52;
    rr(bx, byy, 160, 26, 8); ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fill();
    txt("大イノシシ", bx + 10, byy + 13, 12, "#fff", "left", 900);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = i < boss.hp ? "#ff5a5a" : "rgba(255,255,255,0.25)"; ctx.beginPath(); ctx.arc(bx + 100 + i * 20, byy + 13, 7, 0, Math.PI * 2); ctx.fill(); }
  }
  if (bannerT > 0) {
    const a = clamp(bannerT / 0.4, 0, 1);
    ctx.globalAlpha = a;
    txtO(`第${run.stage}面　${L.th.name}`, W / 2, offY + ROWS * T * scale * 0.32, small ? 26 : 34, "#fff");
    ctx.globalAlpha = 1;
  }
  if (msg) { ctx.globalAlpha = clamp(msg.t / 0.3, 0, 1); txtO(msg.text, W / 2, offY + ROWS * T * scale * 0.42, small ? 17 : 21, "#ffe27a"); ctx.globalAlpha = 1; }
}

function drawControls() {
  if (!ctrlButtons.length) return;
  if (ctrlH) { ctx.fillStyle = "#26303a"; ctx.fillRect(0, H - ctrlH, W, ctrlH); }
  const on = { L: input.left, R: input.right, J: input.jumpHeld, F: input.fire };
  for (const b of ctrlButtons) {
    const dim = b.id === "F" && run.form !== 2;
    rr(b.x, b.y, b.w, b.h, 16);
    ctx.fillStyle = on[b.id] ? "rgba(255,255,255,0.55)" : ctrlH ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.28)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 2; ctx.stroke();
    txt(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, b.id === "J" ? 17 : 24, dim ? "rgba(255,255,255,0.35)" : (b.id === "F" ? "#ffb08a" : "#fff"), "center", 900);
  }
}

function overlayBox(h) {
  ctx.fillStyle = "rgba(10,14,24,0.55)"; ctx.fillRect(0, 0, W, H);
  const bw = Math.min(360, W - 32), x0 = W / 2 - bw / 2, y0 = Math.max(20, (H - ctrlH - h) / 2);
  rr(x0, y0, bw, h, 18); ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.fill();
  return { x0, y0, bw };
}
function drawPause() {
  const { x0, y0, bw } = overlayBox(250);
  txt("ポーズ", W / 2, y0 + 36, 22, "#333", "center", 900);
  button(x0 + 20, y0 + 66, bw - 40, 50, "つづける", { fill: "#f08a2b", color: "#fff", size: 17, main: true }, () => { paused = false; });
  button(x0 + 20, y0 + 126, bw - 40, 44, mute ? "音：オフ" : "音：オン", { fill: "#eee", size: 15 }, () => { mute = !mute; try { localStorage.setItem("kusoge015-mute", mute ? "1" : "0"); } catch (e) { } });
  button(x0 + 20, y0 + 180, bw - 40, 44, "タイトルへ", { fill: "#eee", size: 15 }, () => { paused = false; scene = "title"; });
}
function drawClearOverlay(time) {
  if (clearT < 1.4) return;
  const { x0, y0, bw } = overlayBox(260);
  txt(`第${run.stage}面 クリア！`, W / 2, y0 + 38, 24, "#e0701a", "center", 900);
  for (let i = 0; i < 3; i++) {
    drawBigCoin(W / 2 - 40 + i * 40, y0 + 86, 15, time, false, true);
    if (!run.bigGot[i]) { ctx.fillStyle = "rgba(230,230,235,0.92)"; ctx.beginPath(); ctx.arc(W / 2 - 40 + i * 40, y0 + 86, 16, 0, Math.PI * 2); ctx.fill(); txt("?", W / 2 - 40 + i * 40, y0 + 87, 14, "#aaa"); }
  }
  txt(`メダル +${run.stageMedals}`, W / 2, y0 + 128, 16, "#555", "center", 800);
  const last = run.stage >= STAGES;
  button(x0 + 20, y0 + 150, bw - 40, 50, last ? "エンディングへ" : "つぎの面へ", { fill: "#f08a2b", color: "#fff", size: 17, main: true }, nextStage);
  button(x0 + 20, y0 + 208, bw - 40, 40, "タイトルへ", { fill: "#eee", size: 14 }, () => { scene = "title"; });
}
function drawOver() {
  const { x0, y0, bw } = overlayBox(220);
  txt("ゲームオーバー", W / 2, y0 + 40, 24, "#c03a3a", "center", 900);
  txt(`第${run.stage}面まで進んだ`, W / 2, y0 + 74, 14, "#666", "center", 700);
  button(x0 + 20, y0 + 100, bw - 40, 50, `第${run.stage}面から続ける`, { fill: "#f08a2b", color: "#fff", size: 17, main: true }, () => newRun(run.stage));
  button(x0 + 20, y0 + 160, bw - 40, 42, "タイトルへ", { fill: "#eee", size: 14 }, () => { scene = "title"; });
}

// ---- タイトル ----
function drawTitle(time) {
  const th = THEMES[0];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#a7d99a"; ctx.beginPath(); ctx.ellipse(W * 0.25, H, W * 0.5, 160, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#7cc46b"; ctx.beginPath(); ctx.ellipse(W * 0.8, H, W * 0.45, 110, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#5cbf4a"; ctx.fillRect(0, H - 40, W, 40); ctx.fillStyle = "#a8673a"; ctx.fillRect(0, H - 28, W, 28);
  buttons = [];
  const cx = W / 2, small = W < 520;
  let y = Math.max(18, (H - 640) / 2);
  drawKon(cx, y + 74, 62, 1, 0, time * 8, false, false);
  ctx.fillStyle = "#e3241b"; ctx.beginPath(); ctx.ellipse(cx + 56, y + 50, 8, 5, -0.5, 0, Math.PI * 2); ctx.fill();
  drawBigCoin(cx - 60, y + 40, 13, time, false);
  y += 98;
  txtO("コンのぼうけん", cx, y, small ? 34 : 44, "#fff6e0", "center", "#b4561a"); y += 32;
  txt("キツネの子コンの、横スクロールアクション", cx, y, small ? 12 : 14, "#2d5a7a", "center", 800); y += 22;
  const bw = Math.min(360, W - 24), x0 = cx - bw / 2;
  const rules = [
    "・←→で走る。ジャンプは長押しで高くとぶ",
    "・敵は上からふんでたおす（トゲボールはむり）",
    "・箱をたたくとアイテムが出る",
    "　ハチミツで大きく、とうがらしで火の玉",
    "・コイン100枚で残機+1。大きな金貨は各面3枚",
    "・ちょうちんは中間地点。4面と8面はボス戦",
    "・巣穴に入ればクリア。全8面",
  ];
  const lh = small ? 19 : 21, rh = rules.length * lh + 34;
  rr(x0, y, bw, rh, 14); ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.fill();
  rules.forEach((r, i) => txt(r, x0 + 12, y + 12 + lh / 2 + i * lh, small ? 11.5 : 13, "#3a4a3a", "left", 700));
  txt(TOUCH ? "画面下の ◀ ▶・ジャンプ・火 ボタンで操作" : "←→ 移動 ／ スペース・↑ ジャンプ ／ X 火の玉", cx, y + rh - 13, small ? 11 : 12, "#7a5a3a", "center", 800);
  y += rh + 16;
  const best = SV.best;
  if (best > 1) {
    button(x0, y, bw, 52, `続きから（第${best}面・残機5）`, { fill: "#f08a2b", color: "#fff", size: 17, main: true }, () => newRun(best)); y += 60;
    button(x0, y, bw, 40, "第1面から", { fill: "rgba(255,255,255,0.88)", size: 14 }, () => newRun(1)); y += 50;
  } else { button(x0, y, bw, 54, "はじめる", { fill: "#f08a2b", color: "#fff", size: 18, main: true }, () => newRun(1)); y += 64; }
  // 面えらび
  if (best > 1) {
    txt("面をえらぶ", cx, y + 2, 12, "#2d5a7a", "center", 800); y += 14;
    const n = STAGES, gap = 6, sw = Math.min(40, (bw - gap * (n - 1)) / n), sx = cx - (sw * n + gap * (n - 1)) / 2;
    for (let i = 1; i <= n; i++) {
      const open = i <= best;
      const got = SV.big[i - 1].reduce((a, b) => a + b, 0);
      button(sx + (i - 1) * (sw + gap), y, sw, 36, String(i), { fill: open ? (themeOf(i).boss ? "#e9b2a6" : "rgba(255,255,255,0.88)") : "rgba(255,255,255,0.35)", color: open ? "#333" : "#999", size: 14, r: 8 }, () => { if (open) newRun(i); });
      if (open) for (let k = 0; k < 3; k++) { ctx.fillStyle = k < got ? "#ffcf33" : "rgba(0,0,0,0.15)"; ctx.beginPath(); ctx.arc(sx + (i - 1) * (sw + gap) + sw / 2 - 8 + k * 8, y + 31, 2.4, 0, Math.PI * 2); ctx.fill(); }
    }
    y += 44;
  }
  const total = SV.big.flat().reduce((a, b) => a + b, 0);
  txt(`大きな金貨 ${total} / 24${SV.allClear ? "　★全面クリア" : ""}`, cx, y + 6, 12, "#2d5a7a", "center", 800); y += 22;
  button(cx - 70, y, 140, 34, "← 置き場へ", { fill: "transparent", color: "#2d5a7a", size: 14 }, () => { location.href = "../../"; });
}
function drawEnding(time) {
  drawBackground(THEMES[2], time * 40, time);
  buttons = [];
  const cx = W / 2;
  let y = Math.max(40, (H - 420) / 2);
  drawKon(cx, y + 90, 80, 1, 0, time * 8, false, false);
  y += 130;
  txtO("全8面クリア！", cx, y, W < 520 ? 32 : 42, "#fff6e0", "center", "#b4561a"); y += 40;
  txt("コンは大イノシシをやっつけて、", cx, y, 15, "#2d4a6a", "center", 800); y += 24;
  txt("森に平和がもどりました。", cx, y, 15, "#2d4a6a", "center", 800); y += 36;
  const total = SV.big.flat().reduce((a, b) => a + b, 0);
  txt(`大きな金貨 ${total} / 24`, cx, y, 15, "#7a5a1a", "center", 900); y += 30;
  const bw = Math.min(320, W - 32);
  button(cx - bw / 2, y, bw, 50, "タイトルへ", { fill: "#f08a2b", color: "#fff", size: 17, main: true }, () => { scene = "title"; });
}

// ============================================================
//  ループ
// ============================================================
let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const time = now / 1000;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 8) { update(STEP); acc -= STEP; steps++; }
  if (steps >= 8) acc = 0;
  bgmTick(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  buttons = [];
  if (scene === "title") { drawTitle(time); return; }
  if (scene === "ending") { drawEnding(time); return; }
  drawWorld(time);
  drawHUD(time);
  drawControls();
  if (scene === "clear") drawClearOverlay(time);
  else if (scene === "over") drawOver();
  else if (paused) drawPause();
}
resize();
requestAnimationFrame(frame);
</script>
</body>
