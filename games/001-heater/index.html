<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ヒーターを守れ！</title>
<style>
  html,body{margin:0;height:100%;background:#0b1a2a;overflow:hidden;touch-action:none;
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ============================================================
//  ヒーターを守れ！ — 極寒サバイバル（クソゲー）
//  画像ファイルなし：すべてコードで描画
// ============================================================
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const FONT = 'system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif';

let W = 0, H = 0, DPR = 1, Z = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  Z = clamp(Math.min(W, H) / 640, 0.62, 1.15); // ワールドの拡大率
}
addEventListener("resize", resize);
resize();

// ---------- ユーティリティ ----------
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function rand(a, b) { return a + Math.random() * (b - a); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- 定数 ----------
const WORLD = 2000;
const C = { x: WORLD / 2, y: WORLD / 2 }; // ヒーターの位置
const DAY_LEN = 45;     // 1日の秒数
const NIGHT_START = 0.62; // 1日のうち夜が始まる割合
const GOAL_DAYS = 5;

// ---------- 入力 ----------
const keys = {};
addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if (e.key === " " || e.key === "Enter") tap(); });
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
const joy = { active: false, ox: 0, oy: 0, x: 0, y: 0, id: null };
cv.addEventListener("pointerdown", e => {
  if (G.state !== "play") { tap(); return; }
  joy.active = true; joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY;
});
cv.addEventListener("pointermove", e => { if (joy.active && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const endJoy = e => { if (e.pointerId === joy.id) joy.active = false; };
cv.addEventListener("pointerup", endJoy);
cv.addEventListener("pointercancel", endJoy);

function inputDir() {
  let dx = 0, dy = 0;
  if (keys["a"] || keys["arrowleft"]) dx -= 1;
  if (keys["d"] || keys["arrowright"]) dx += 1;
  if (keys["w"] || keys["arrowup"]) dy -= 1;
  if (keys["s"] || keys["arrowdown"]) dy += 1;
  if (joy.active) {
    const jx = joy.x - joy.ox, jy = joy.y - joy.oy, l = Math.hypot(jx, jy);
    if (l > 8) { const k = Math.min(1, l / 60); dx = jx / l * k; dy = jy / l * k; }
  }
  const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  return { x: dx, y: dy };
}

// ---------- 効果音（コードで生成） ----------
let AC = null;
function beep(freq, dur, type = "square", vol = 0.05, slide = 0) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), AC.currentTime + dur);
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { /* 音が出せない環境は無視 */ }
}
const SFX = {
  chop: () => beep(rand(180, 220), 0.06, "square", 0.04),
  put: () => beep(rand(500, 560), 0.05, "triangle", 0.05),
  save: () => { beep(660, 0.1, "triangle", 0.07); setTimeout(() => beep(990, 0.15, "triangle", 0.07), 90); },
  build: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12, "triangle", 0.06), i * 70)); },
  hit: () => beep(140, 0.15, "sawtooth", 0.06, -80),
  throw: () => beep(900, 0.05, "sine", 0.03, -400),
  wolf: () => beep(300, 0.25, "sawtooth", 0.03, 200),
  over: () => { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.3, "triangle", 0.07), i * 200)); },
};

// ---------- ゲーム状態 ----------
let G;
function newGame() {
  G = {
    state: "title",
    t: 0,          // 経過秒
    fuel: 100, fuelMax: 100,
    warmR: 230,
    logValue: 5,
    rescued: 0,
    dead: false,
    storm: 0, nextStorm: rand(25, 40),
    shake: 0,
    msg: null,
    player: { x: C.x, y: C.y + 120, stack: 0, cap: 10, chopT: 0, face: 1, walk: 0, hurtT: 0, throwT: 0, putT: 0 },
    trees: [], survivors: [], wolves: [], balls: [], flying: [], texts: [], poofs: [],
    pads: [
      { kind: "bag",    x: C.x - 190, y: C.y + 150, level: 0, costs: [10, 25, 50], paid: 0, label: "リュック拡張" },
      { kind: "hut",    x: C.x + 190, y: C.y + 150, level: 0, costs: [20],         paid: 0, label: "木こり小屋" },
      { kind: "heater", x: C.x,       y: C.y - 265, level: 0, costs: [30, 60],     paid: 0, label: "ヒーター強化" },
    ],
    huts: 0,
    spawnT: 15, wolfT: 0,
  };
  // 木を配置
  let tries = 0;
  while (G.trees.length < 75 && tries++ < 3000) {
    const x = rand(80, WORLD - 80), y = rand(80, WORLD - 80);
    if (Math.hypot(x - C.x, y - C.y) < 320) continue;
    if (G.trees.some(t => Math.hypot(t.x - x, t.y - y) < 70)) continue;
    G.trees.push({ x, y, hp: 3, alive: true, respawn: 0, shake: 0, s: rand(0.85, 1.15) });
  }
  // 凍った人を配置
  for (let i = 0; i < 6; i++) spawnSurvivor();
}
function spawnSurvivor() {
  for (let k = 0; k < 50; k++) {
    const a = rand(0, Math.PI * 2), r = rand(380, 880);
    const x = C.x + Math.cos(a) * r, y = C.y + Math.sin(a) * r;
    if (x < 60 || y < 60 || x > WORLD - 60 || y > WORLD - 60) continue;
    if (G.trees.some(t => t.alive && Math.hypot(t.x - x, t.y - y) < 40)) continue;
    G.survivors.push({ x, y, state: "frozen", thaw: 0, tx: x, ty: y, shiver: rand(0, 6), carry: 0, chopT: 0, target: null,
      hue: [210, 140, 30, 330, 270][Math.floor(rand(0, 5))] });
    return;
  }
}

const day = () => Math.floor(G.t / DAY_LEN) + 1;
const dayFrac = () => (G.t % DAY_LEN) / DAY_LEN;
const isNight = () => day() >= 2 && dayFrac() > NIGHT_START;
const darkness = () => {
  const f = dayFrac();
  if (day() < 2) return 0;
  if (f < NIGHT_START - 0.08) return f < 0.08 ? (0.08 - f) / 0.08 * 0.75 : 0;
  return clamp((f - (NIGHT_START - 0.08)) / 0.1, 0, 1) * 0.75;
};

function tap() {
  if (G.state === "title") { G.state = "play"; beep(660, 0.1, "triangle", 0.05); }
  else if (G.state === "over" || G.state === "clear") { if (G.endT > 1) { newGame(); G.state = "play"; } }
}

function say(text, color = "#fff") { G.msg = { text, color, t: 2.6 }; }
function floatText(x, y, text, color = "#fff", size = 18) { G.texts.push({ x, y, text, color, size, t: 1.1 }); }
function fly(x0, y0, x1, y1, onArrive, kind = "log") { G.flying.push({ x0, y0, x1, y1, t: 0, onArrive, kind }); }

// ---------- 更新 ----------
function update(dt) {
  if (G.state !== "play") { G.endT = (G.endT || 0) + dt; return; }
  const P = G.player;
  const prevDay = day();
  G.t += dt;

  // 日付の切り替え
  if (day() !== prevDay) {
    if (prevDay >= GOAL_DAYS) { G.state = "clear"; G.endT = 0; SFX.build(); return; }
    say(`DAY ${day()}　夜はオオカミが出るぞ`, "#ffd27a");
    G.wolves.forEach(w => { w.flee = true; });
  }
  if (isNight() && !G.nightSaid) { G.nightSaid = true; say("夜が来た…オオカミに注意！", "#ff9b9b"); SFX.wolf(); }
  if (!isNight()) G.nightSaid = false;

  // 吹雪
  if (day() >= 2) {
    if (G.storm > 0) G.storm -= dt;
    else { G.nextStorm -= dt; if (G.nextStorm <= 0) { G.storm = 10; G.nextStorm = rand(30, 50); say("吹雪だ！ヒーターの減りが2倍！", "#bfe6ff"); } }
  }

  // ヒーターの燃料が減る
  const warmPeople = G.survivors.filter(s => s.state === "warm" || s.state === "work").length;
  const drain = (0.9 + warmPeople * 0.22 + (day() - 1) * 0.3) * (G.storm > 0 ? 2 : 1);
  G.fuel -= drain * dt;
  if (G.fuel <= 0) { G.fuel = 0; G.state = "over"; G.endT = 0; SFX.over(); return; }

  // プレイヤー移動
  const d = inputDir();
  const spd = 230;
  P.x = clamp(P.x + d.x * spd * dt, 30, WORLD - 30);
  P.y = clamp(P.y + d.y * spd * dt, 30, WORLD - 30);
  if (Math.abs(d.x) + Math.abs(d.y) > 0.1) { P.walk += dt * 10; if (d.x) P.face = d.x > 0 ? 1 : -1; }
  // 木・ヒーターとの当たり（押し戻し）
  for (const t of G.trees) if (t.alive) pushOut(P, t, 22);
  pushOut(P, C, 58);
  P.hurtT = Math.max(0, P.hurtT - dt);

  // 木を切る
  P.chopT -= dt;
  if (P.stack < P.cap) {
    let near = null, nd = 52;
    for (const t of G.trees) if (t.alive) { const dd = dist(P, t); if (dd < nd) { nd = dd; near = t; } }
    if (near && P.chopT <= 0) {
      P.chopT = 0.32;
      near.hp--; near.shake = 0.2; SFX.chop();
      const tx = near.x, ty = near.y - 30;
      fly(tx, ty, P.x, P.y - 40, () => { P.stack = Math.min(P.cap, P.stack + 1); });
      if (near.hp <= 0) { near.alive = false; near.respawn = 22; }
    }
  } else if (P.stack >= P.cap && !P.fullSaid) { P.fullSaid = true; floatText(P.x, P.y - 70, "もう持てない！", "#ff8080", 16); }
  if (P.stack < P.cap) P.fullSaid = false;

  // 木の再生
  for (const t of G.trees) {
    t.shake = Math.max(0, t.shake - dt);
    if (!t.alive) { t.respawn -= dt; if (t.respawn <= 0) { t.alive = true; t.hp = 3; } }
  }

  // ヒーターに薪をくべる
  P.putT -= dt;
  if (P.stack > 0 && dist(P, C) < 110 && P.putT <= 0 && G.fuel < G.fuelMax) {
    P.putT = 0.07; P.stack--;
    fly(P.x, P.y - 40, C.x, C.y - 30, () => { G.fuel = Math.min(G.fuelMax, G.fuel + G.logValue); SFX.put(); });
  }

  // 建設パッド
  for (const pad of G.pads) {
    if (pad.level >= pad.costs.length) continue;
    const cost = pad.costs[pad.level];
    pad.payT = (pad.payT || 0) - dt;
    if (P.stack > 0 && Math.abs(P.x - pad.x) < 55 && Math.abs(P.y - pad.y) < 40 && pad.payT <= 0) {
      pad.payT = 0.06; P.stack--;
      fly(P.x, P.y - 40, pad.x, pad.y, () => {
        pad.paid++; SFX.put();
        if (pad.paid >= cost) { pad.paid = 0; pad.level++; applyPad(pad); }
      });
    }
  }

  // 凍った人・助けた人
  for (const s of G.survivors) {
    s.shiver += dt * 30;
    if (s.state === "frozen") {
      if (dist(P, s) < 60) { s.thaw += dt / 1.3; if (s.thaw >= 1) { s.state = "follow"; SFX.save(); floatText(s.x, s.y - 50, "ついていく！", "#bfe6ff"); } }
      else s.thaw = Math.max(0, s.thaw - dt * 0.5);
    } else if (s.state === "follow") {
      // 列になってついてくる
      const followers = G.survivors.filter(o => o.state === "follow");
      const idx = followers.indexOf(s);
      const lead = idx === 0 ? P : followers[idx - 1];
      const dd = dist(s, lead);
      if (dd > 38) { const k = Math.min(1, (dd - 38) / dd) * Math.min(1, dt * 8); s.x += (lead.x - s.x) * k; s.y += (lead.y - s.y) * k; }
      if (dist(s, C) < G.warmR) {
        s.state = G.huts > 0 ? "work" : "warm";
        const a = rand(0, Math.PI * 2), r = rand(80, 140);
        s.tx = C.x + Math.cos(a) * r; s.ty = C.y + Math.sin(a) * r;
        G.rescued++; SFX.save(); floatText(s.x, s.y - 50, "救出！", "#ffd27a", 22);
      }
    } else if (s.state === "warm") {
      moveTo(s, s.tx, s.ty, 90, dt);
    } else if (s.state === "work") {
      workerAI(s, dt);
    }
  }
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    G.spawnT = 18;
    if (G.survivors.filter(s => s.state === "frozen").length < 6) { spawnSurvivor(); }
  }

  // オオカミ
  if (isNight()) {
    G.wolfT -= dt;
    const max = 2 + day() * 2;
    if (G.wolfT <= 0 && G.wolves.filter(w => !w.flee).length < max) {
      G.wolfT = Math.max(1.2, 3.2 - day() * 0.35);
      const a = rand(0, Math.PI * 2), r = Math.max(W, H) / Z * 0.65 + 60;
      G.wolves.push({ x: clamp(P.x + Math.cos(a) * r, 10, WORLD - 10), y: clamp(P.y + Math.sin(a) * r, 10, WORLD - 10),
        hp: 2 + Math.floor(day() / 2), flash: 0, biteT: 0, flee: false, walk: 0 });
    }
  }
  for (const w of G.wolves) {
    w.flash = Math.max(0, w.flash - dt); w.biteT = Math.max(0, w.biteT - dt); w.walk += dt * 12;
    if (w.flee) {
      const a = Math.atan2(w.y - C.y, w.x - C.x);
      w.x += Math.cos(a) * 260 * dt; w.y += Math.sin(a) * 260 * dt;
      if (w.x < -50 || w.y < -50 || w.x > WORLD + 50 || w.y > WORLD + 50) w.dead = true;
      continue;
    }
    const sp = 115 + day() * 8;
    const a = Math.atan2(P.y - w.y, P.x - w.x);
    w.x += Math.cos(a) * sp * dt; w.y += Math.sin(a) * sp * dt;
    w.face = Math.cos(a) > 0 ? 1 : -1;
    // ヒーターの近くには入れない
    if (dist(w, C) < G.warmR * 0.6) { const b = Math.atan2(w.y - C.y, w.x - C.x); w.x = C.x + Math.cos(b) * G.warmR * 0.6; w.y = C.y + Math.sin(b) * G.warmR * 0.6; }
    if (dist(w, P) < 34 && w.biteT <= 0 && P.hurtT <= 0) {
      w.biteT = 1; P.hurtT = 1; G.shake = 0.3; SFX.hit();
      const lost = Math.min(3, P.stack);
      P.stack -= lost;
      floatText(P.x, P.y - 70, lost ? `まき -${lost}` : "いたっ！", "#ff8080", 18);
      const kb = Math.atan2(P.y - w.y, P.x - w.x);
      P.x = clamp(P.x + Math.cos(kb) * 40, 30, WORLD - 30); P.y = clamp(P.y + Math.sin(kb) * 40, 30, WORLD - 30);
    }
  }
  G.wolves = G.wolves.filter(w => !w.dead);

  // 雪玉を自動で投げる
  P.throwT -= dt;
  if (P.throwT <= 0) {
    let target = null, td = 270;
    for (const w of G.wolves) if (!w.flee) { const dd = dist(P, w); if (dd < td) { td = dd; target = w; } }
    if (target) {
      P.throwT = 0.45; SFX.throw();
      const a = Math.atan2(target.y - P.y, target.x - P.x);
      G.balls.push({ x: P.x, y: P.y - 20, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, life: 0.7 });
    }
  }
  for (const b of G.balls) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const w of G.wolves) {
      if (!w.flee && !w.dead && Math.hypot(w.x - b.x, w.y - 20 - b.y) < 26) {
        b.life = 0; w.hp--; w.flash = 0.12;
        if (w.hp <= 0) { w.dead = true; G.poofs.push({ x: w.x, y: w.y, t: 0 }); floatText(w.x, w.y - 40, "撃退！", "#fff", 16); }
        break;
      }
    }
  }
  G.balls = G.balls.filter(b => b.life > 0);
  G.wolves = G.wolves.filter(w => !w.dead);

  // 演出
  for (const f of G.flying) { f.t += dt / 0.35; if (f.t >= 1 && !f.done) { f.done = true; f.onArrive && f.onArrive(); } }
  G.flying = G.flying.filter(f => !f.done);
  for (const t of G.texts) { t.t -= dt; t.y -= 30 * dt; }
  G.texts = G.texts.filter(t => t.t > 0);
  for (const p of G.poofs) p.t += dt;
  G.poofs = G.poofs.filter(p => p.t < 0.5);
  if (G.msg) { G.msg.t -= dt; if (G.msg.t <= 0) G.msg = null; }
  G.shake = Math.max(0, G.shake - dt);
}

function pushOut(a, b, r) {
  const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
  if (d < r && d > 0.01) { a.x = b.x + dx / d * r; a.y = b.y + dy / d * r; }
}
function moveTo(s, x, y, sp, dt) {
  const dx = x - s.x, dy = y - s.y, d = Math.hypot(dx, dy);
  if (d < 3) return true;
  const k = Math.min(1, sp * dt / d); s.x += dx * k; s.y += dy * k; s.moving = true;
  return false;
}
function workerAI(s, dt) {
  if (s.carry >= 3) {
    if (moveTo(s, C.x + (s.x > C.x ? 70 : -70), C.y + 30, 110, dt) || dist(s, C) < 85) {
      const n = s.carry; s.carry = 0;
      for (let i = 0; i < n; i++) setTimeout(() => fly(s.x, s.y - 30, C.x, C.y - 30, () => { G.fuel = Math.min(G.fuelMax, G.fuel + G.logValue); }), i * 80);
    }
    return;
  }
  if (!s.target || !s.target.alive) {
    let best = null, bd = 1e9;
    for (const t of G.trees) if (t.alive) { const d = dist(t, C) + rand(0, 200); if (d < bd) { bd = d; best = t; } }
    s.target = best;
  }
  if (!s.target) return;
  if (dist(s, s.target) > 40) moveTo(s, s.target.x, s.target.y + 20, 110, dt);
  else {
    s.chopT -= dt;
    if (s.chopT <= 0) {
      s.chopT = 0.9; s.target.hp--; s.target.shake = 0.2; s.carry++;
      if (s.target.hp <= 0) { s.target.alive = false; s.target.respawn = 22; s.target = null; }
    }
  }
}
function applyPad(pad) {
  SFX.build(); G.shake = 0.15;
  if (pad.kind === "bag") { G.player.cap += 10; say(`リュックが大きくなった！（${G.player.cap}本まで）`, "#ffd27a"); }
  if (pad.kind === "hut") {
    G.huts = 1;
    G.survivors.forEach(s => { if (s.state === "warm") s.state = "work"; });
    say("木こり小屋ができた！助けた人が薪を集めてくれる", "#ffd27a");
  }
  if (pad.kind === "heater") {
    G.fuelMax += 50; G.warmR += 40; G.logValue += 1; G.fuel = Math.min(G.fuelMax, G.fuel + 30);
    say("ヒーターがパワーアップ！", "#ffd27a");
  }
}

// ============================================================
//  描画
// ============================================================
let cam = { x: C.x, y: C.y };
const snow = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), s: rand(1, 3), v: rand(20, 60) }));
let fog = document.createElement("canvas"), fctx = fog.getContext("2d");

function render(time) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const P = G.player;
  cam.x = lerp(cam.x, P.x, 0.12); cam.y = lerp(cam.y, P.y, 0.12);
  if (G.state === "title") { cam.x = C.x + Math.sin(time / 3000) * 60; cam.y = C.y + 40; }

  const sx = G.shake > 0 ? rand(-6, 6) : 0, sy = G.shake > 0 ? rand(-6, 6) : 0;
  ctx.save();
  ctx.translate(W / 2 + sx, H / 2 + sy);
  ctx.scale(Z, Z);
  ctx.translate(-cam.x, -cam.y);

  drawGround();
  drawWarmZone(time);
  G.pads.forEach(drawPad);
  // 切り株

}

    ctx.font = `900 ${W < 500 ? 16 : 20}px ${FONT}`; ctx.textAlign = "center";
    const w = ctx.measureText(G.msg.text).width + 32;
    ctx.fillStyle = "rgba(15,30,50,.8)"; rr(W / 2 - w / 2, 84, w, 40, 20); ctx.fill();
    ctx.fillStyle = G.msg.color; ctx.fillText(G.msg.text, W / 2, 110);
    ctx.globalAlpha = 1;
  }
}
function drawJoystick() {
  if (!joy.active) return;
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, 7); ctx.stroke();
  const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), k = l > 50 ? 50 / l : 1;
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(joy.ox + dx * k, joy.oy + dy * k, 22, 0, 7); ctx.fill();
}
function panel(lines, time) {
  ctx.fillStyle = "rgba(10,22,40,.55)"; ctx.fillRect(0, 0, W, H);
}
function drawTitle(time) {
  panel();
  const s = Math.min(1, W / 520);
  ctx.textAlign = "center";
  ctx.font = `900 ${Math.round(16 * s + 4)}px ${FONT}`; ctx.fillStyle = "#bfe6ff";
  ctx.fillText("極寒サバイバル（クソゲー）", W / 2, H * 0.28);
  ctx.font = `900 ${Math.round(56 * s)}px ${FONT}`;
  ctx.lineWidth = 8; ctx.strokeStyle = "#7a2e12"; ctx.strokeText("ヒーターを守れ！", W / 2, H * 0.28 + 66 * s);
  ctx.fillStyle = "#ffb347"; ctx.fillText("ヒーターを守れ！", W / 2, H * 0.28 + 66 * s);
  const lines = [
    "木に近づくと自動で薪を集める",
    "ヒーターの近くで薪をくべる",
    "凍った人に近づいて助け、ヒーターまで連れて帰る",
    `${GOAL_DAYS}日間ヒーターを消さずに生き延びろ`,
  ];
  ctx.font = `700 ${Math.round(15 * s + 2)}px ${FONT}`; ctx.fillStyle = "#fff";
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H * 0.28 + 120 * s + i * 28 * Math.max(s, .8)));
  ctx.font = `700 ${Math.round(13 * s + 2)}px ${FONT}`; ctx.fillStyle = "#9fb7cc";
  ctx.fillText("移動：WASD / 矢印キー / 画面をドラッグ", W / 2, H * 0.28 + 250 * Math.max(s, .8));
  ctx.globalAlpha = 0.6 + Math.sin(time / 300) * 0.4;
  ctx.font = `900 ${Math.round(20 * s + 2)}px ${FONT}`; ctx.fillStyle = "#ffd27a";
  ctx.fillText("タップ / クリックでスタート", W / 2, H * 0.28 + 300 * Math.max(s, .8));
  ctx.globalAlpha = 1;
}
function drawEnd(clear) {
  panel();
  const s = Math.min(1, W / 520);
  ctx.textAlign = "center";
  ctx.font = `900 ${Math.round(46 * s)}px ${FONT}`;
  ctx.fillStyle = clear ? "#ffd27a" : "#9fd4ff";
  ctx.fillText(clear ? "生き延びた！" : "ヒーターが消えた…", W / 2, H * 0.36);
  ctx.font = `700 ${Math.round(16 * s + 3)}px ${FONT}`; ctx.fillStyle = "#fff";
  ctx.fillText(clear ? "村は春を迎えた（たぶん）" : "村は全員カチコチになった", W / 2, H * 0.36 + 44);
  ctx.fillText(`到達 DAY ${Math.min(day(), GOAL_DAYS)}　／　救出 ${G.rescued}人`, W / 2, H * 0.36 + 80);
  if (G.endT > 1) {
    ctx.font = `900 ${Math.round(18 * s + 3)}px ${FONT}`; ctx.fillStyle = "#ffd27a";
    ctx.fillText("タップ / クリックでもう一回", W / 2, H * 0.36 + 130);
  }
}

// ---------- メインループ ----------
newGame();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  render(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__game = { get G() { return G; }, newGame, update };
</script>
